name: Daily README update

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"   # 4 fois par jour : 00h, 06h, 12h, 18h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Mettre à jour le README
        run: |
          NOW=$(date -u +'%d/%m/%Y à %H:%M UTC')
          sed -i "s|^Dernière mise à jour :.*|Dernière mise à jour : $NOW|" README.md

      - name: Commit et push
        run: |
          git config user.name "abbuss11"
          git config user.email "idrissabba14@gmail.com"
          git add README.md
          git commit -m "chore: update $(date -u +'%Y-%m-%d %H:%M')" || exit 0
          git push
