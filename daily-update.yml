name: Daily README update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mettre à jour le README
        run: |
          TODAY=$(date -u +'%d/%m/%Y')
          sed -i "s|^Dernière mise à jour :.*|Dernière mise à jour : $TODAY|" README.md

      - name: Commit et push
        run: |
          git config user.name "abbuss11"
          git config user.email "idrissabba14@gmail.com"
          git add README.md
          git commit -m "chore: daily update $(date -u +'%Y-%m-%d')" || exit 0
          git push
